name: Generate index

on:
    push:
        branches: 'main'
        paths:
            - 'localized_data/**'
    workflow_dispatch:

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: release
                  fetch-depth: 0

            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              run:
                  |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  npm install -g prettier prettier-plugin-sort-json

            - name: Merge changes from main
              run:
                  |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git fetch origin main
                  git merge -X theirs origin/main

            - name: Create index
              run: python gen_index.py

            - name: Format all JSON files (Index & Localized Data)
              run:
                  |
                  if [ -f ".prettierrc" ] || [ -f ".prettierrc.json" ]; then
                      prettier --write "index.json" "localized_data/**/*.json"
                  else
                      prettier --write --plugin=prettier-plugin-sort-json "index.json" "localized_data/**/*.json"
                  fi

            - uses: stefanzweifel/git-auto-commit-action@v5
              with:
                  commit_message: 'Update index and format localized data'
                  branch: release
                  file_pattern: 'index.json localized_data/**'

            - name: Send update
              if: ${{ vars.NOTIFY_REPO }}
              run:
                  |
                  curl -L -X POST \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer ${{ secrets.UPD_TOKEN }}" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  https://api.github.com/repos/${{ github.repository_owner }}/${{ vars.NOTIFY_REPO }}/actions/workflows/release.yml/dispatches \
                  -d '{"ref":"main"}'
