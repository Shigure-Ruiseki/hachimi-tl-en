name: Generate index

on:
  push:
    branches: 'main'
    paths:
      - 'localized_data/**'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Merge changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge -X theirs origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create index
        run: python gen_index.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update index
          branch: release
          file_pattern: 'index.json'

      - name: Send update to downstream repositories
        env:
          UPD_TOKEN: ${{ secrets.UPD_TOKEN }}
          CURRENT_REPO: ${{ github.event.repository.name }}
        run: |
          if [ -z "$UPD_TOKEN" ]; then
            echo "❌ [LOG]: Secret UPD_TOKEN chưa được cấu hình!"
            exit 1
          fi

          echo "🔍 Đang liệt kê tất cả các repo trong tài khoản (xử lý phân trang)..."
          
          while :; do
            response=$(curl -L -s -H "Authorization: Bearer $UPD_TOKEN" \
              "https://api.github.com/user/repos?per_page=100&page=$page")
            
            # Kiểm tra xem curl có trả về lỗi (401 Unauthorized) không
            if echo "$response" | grep -q "message.: .Bad credentials"; then
              echo "❌ [ERROR]: Token không hợp lệ hoặc hết hạn!"
              exit 1
            fi

            if [ "$response" == "[]" ] || [ -z "$response" ]; then break; fi
            
            # Sử dụng jq (nếu có) hoặc grep để lấy tên repo
            page_repos=$(echo "$response" | grep -o '"name": "[^"]*"' | cut -d'"' -f4 | grep "^hachimi-tl-")
            all_repos="$all_repos $page_repos"
            
            ((page++))
          done

          # Loại bỏ chính repo hiện tại khỏi danh sách
          target_repos=$(echo "$all_repos" | tr ' ' '\n' | grep -v "^$CURRENT_REPO$" | sort -u)

          if [ -z "$target_repos" ]; then
            echo "⚠️ Không tìm thấy repo nào có tiền tố 'hachimi-tl-' ngoại trừ repo hiện tại."
            exit 0
          fi

          echo "✅ Danh sách các repo mục tiêu:"
          echo "$target_repos"

          for target_repo in $target_repos; do
            echo "🚀 Sending trigger signal to: ${{ github.repository_owner }}/$target_repo"
            
            RESPONSE=$(curl -L -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $UPD_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${{ github.repository_owner }}/$target_repo/dispatches \
              -d "{\"event_type\": \"$CURRENT_REPO\", \"client_payload\": {\"ref\": \"main\"}}")
              
            if [ "$RESPONSE" -eq 204 ]; then
              echo "✅ Triggered $target_repo successfully."
            else
              echo "❌ Failed to trigger $target_repo (HTTP $RESPONSE)."
            fi
          done